name: CI

# Se déclenche à chaque push (toutes branches) et à chaque Pull Request
on:
  push:
  pull_request:

# Valeurs FACTICES : suffisent pour tester sans toucher à vos vraies bases/clés.
# ⚠️ Les noms doivent correspondre à ceux lus par votre config.py. Si le CI affiche
#    "field required", ajoutez ici la variable manquante (toujours avec une fausse valeur).
env:
  DB_HOST: localhost
  DB_PORT: "3306"
  DB_USER: test
  DB_PASS: test
  JWT_SECRET: ci-secret-factice
  LLM_PROVIDER: groq
  GROQ_API_KEY: factice
  OPENAI_API_KEY: factice

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Erreurs graves uniquement : syntaxe invalide, noms non définis, etc.
      - name: Lint (ruff)
        run: ruff check . --select E9,F63,F7,F82

      - name: Tests (pytest)
        run: pytest -v

  docker:
    name: Build Docker + démarrage
    needs: test            # ne s'exécute que si "test" a réussi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t schoolmate-chatbot-api .

      - name: Démarrer le conteneur et vérifier qu'il répond
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DB_HOST -e DB_PORT -e DB_USER -e DB_PASS -e JWT_SECRET \
            -e LLM_PROVIDER -e GROQ_API_KEY -e OPENAI_API_KEY \
            schoolmate-chatbot-api
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/docs > /dev/null; then
              echo "✅ L'API répond dans le conteneur"; exit 0
            fi
            sleep 2
          done
          echo "❌ L'API ne répond pas. Logs du conteneur :"
          docker logs api
          exit 1